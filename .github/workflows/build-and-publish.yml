name: Nexus Forge CI/CD Pipeline

# 触发条件：当主分支有代码推送，或手动点击运行时触发
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# 环境变量设置
env:
  REGISTRY: ghcr.io
  # github.repository 会自动获取你的 "用户名/仓库名"
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    # 赋予工作流读取仓库和写入 GitHub Packages (GHCR) 的权限
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to the Container registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # 这里的 GITHUB_TOKEN 是 GitHub 自动提供的，无需手动配置
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 自动打标签：以分支名和 git sha 作为 tag
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: 🚀 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 开启 GitHub Actions 的缓存层，下次构建只需 10 秒
          cache-from: type=gha
          cache-to: type=gha,mode=max
